# ============================================================
# PGNOC-TI — FRONTEND : configuration nginx (production)
# ============================================================
# Sert le build statique (dist/) avec :
#   - fallback SPA (vue-router en history mode)
#   - proxy /api/ et /media/ vers le backend (service "web")
#   - cache correct pour PWA (sw.js jamais en cache, assets immutables)
#
# Le nom d'hôte backend "web" correspond au service web du compose ;
# mettez ce conteneur sur le même réseau Docker.
# Pour un backend distant, remplacer "web:8000" par son adresse.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS Docker : résolution paresseuse du nom "web" (le proxy_pass
    # via $variable force nginx à résoudre au moment de la requête
    # plutôt qu'au démarrage, ce qui évite l'erreur "host not found"
    # quand le conteneur tourne hors compose pour le test).
    resolver 127.0.0.11 valid=30s;

    # ---- API et médias relayés vers le backend ----
    location /api/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- PWA / déploiement : jamais en cache ----
    location = /index.html {
        add_header Cache-Control "no-store";
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # ---- Assets versionnés Vite (hash dans le nom) : cache long ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Fichiers du dossier public/ (favicon, manifeste…) ----
    location ~* \.(?:svg|png|ico|webmanifest|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # ---- Appli SPA : fallback vers index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}